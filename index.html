<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Yacht Dice Deluxe</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#07080a" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-title" content="야추" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23fbf8ef'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%23141519'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23e0314b'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%23141519'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bungee&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
<style>
  :root {
    /* Layout: one-screen card table — player coins on the rail, wood-rimmed felt in the middle,
       ivory score tiles and a brass/ruby roll button in the tray below. No page scroll, ever. */
    --room: #07080a;
    --lacquer: #16181d;
    --lacquer-hi: #24272e;
    --brass: #e0a93b;
    --brass-hi: #ffd77a;
    --ivory: #fbf6e8;
    --ivory-lo: #e8dcc0;
    --ivory-edge: #a99368;
    --ink: #1c1a16;
    --ruby: #e0314b;
    --ruby-lo: #b81a35;
    --mint: #3fe0a9;
    --text: #f3efe6;
    --text-dim: #9a958a;
    --f-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --f-game: 'Bungee', 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    --f-ui: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  html { background: var(--room); }
  body {
    font-family: var(--f-ui);
    color: var(--text);
    background:
      radial-gradient(ellipse 80% 55% at 50% 38%, rgba(40, 70, 58, 0.55) 0%, transparent 70%),
      radial-gradient(ellipse at 50% 120%, rgba(224, 169, 59, 0.10), transparent 60%),
      var(--room);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
  button:disabled { cursor: default; }
  input { font: inherit; user-select: text; -webkit-user-select: text; }
  :focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }

  /* ================= App frame ================= */
  #app {
    height: 100%;
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "hud" "table" "tray" "action";
    gap: 10px;
    padding-block: 10px 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
    #app {
      grid-template-columns: minmax(0, 1fr) 230px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "hud hud" "table table" "tray action";
      gap: 14px;
      padding-block: 16px 20px;
    }
  }
  @media (orientation: landscape) and (max-height: 560px) {
    #app {
      grid-template-columns: minmax(0, 1fr) minmax(300px, 44%);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "table hud" "table tray" "table action";
      gap: 8px;
      padding-block: 8px;
    }
  }

  /* ================= HUD: player coins ================= */
  .hud { grid-area: hud; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .seats { flex: 1; min-width: 0; display: flex; gap: 8px; }
  .seat {
    --pc: #4fd1ff;
    flex: 1 1 0; min-width: 0; max-width: 230px;
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 5px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.035);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: background 0.3s, box-shadow 0.3s, opacity 0.3s;
    opacity: 0.72;
  }
  .seat-coin {
    position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--pc) 55%, white) 0%, var(--pc) 50%, color-mix(in srgb, var(--pc) 55%, black) 100%);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.4), 0 0 0 2px rgba(0, 0, 0, 0.5);
    color: #101114; font: 400 15px var(--f-display);
  }
  .seat-coin::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    border: 1.5px dashed rgba(0, 0, 0, 0.22);
  }
  .seat-meta { min-width: 0; display: flex; flex-direction: column; line-height: 1.05; }
  .seat-name { font: 600 11px var(--f-ui); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat-score { font: 400 21px var(--f-game); color: var(--text); font-variant-numeric: tabular-nums; display: inline-block; }
  .seat.is-turn {
    opacity: 1;
    background: color-mix(in srgb, var(--pc) 15%, transparent);
    box-shadow: inset 0 0 0 1.5px var(--pc), 0 0 22px color-mix(in srgb, var(--pc) 30%, transparent);
  }
  .seat.is-turn .seat-coin { animation: coinBob 1.6s ease-in-out infinite; }
  .seat.is-turn .seat-name { color: var(--pc); }
  .seat.is-hit .seat-coin { animation: coinHit 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .seat-score.bump { animation: numBump 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes coinBob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-6deg); } }
  @keyframes coinHit { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(12deg); } 100% { transform: scale(1); } }
  @keyframes numBump { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--brass-hi); } 100% { transform: scale(1); } }
  @media (max-width: 560px) {
    .seats[data-count="3"] .seat, .seats[data-count="4"] .seat {
      flex-direction: column; gap: 3px; padding: 5px 4px; border-radius: 16px;
    }
    .seats[data-count="3"] .seat-name, .seats[data-count="4"] .seat-name { display: none; }
    .seats[data-count="3"] .seat-meta, .seats[data-count="4"] .seat-meta { align-items: center; }
    .seats[data-count="3"] .seat-coin, .seats[data-count="4"] .seat-coin { width: 32px; height: 32px; font-size: 13px; }
    .seats[data-count="3"] .seat-score, .seats[data-count="4"] .seat-score { font-size: 16px; }
  }

  .hud { position: relative; z-index: 6; }
  .seat { position: relative; }
  .hud-btns { display: flex; gap: 8px; flex: none; }
  .icon-btn { position: relative; }
  .badge {
    position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px;
    display: grid; place-items: center; border-radius: 999px;
    background: var(--ruby); color: #fff; font: 400 10px var(--f-game);
    box-shadow: 0 0 0 2px var(--room);
    animation: holdPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .seat-bubble {
    position: absolute; top: calc(100% + 9px); left: 4px; z-index: 7;
    max-width: min(220px, 70vw); padding: 7px 11px; border-radius: 13px;
    background: var(--ivory); color: var(--ink);
    font: 600 13px var(--f-ui); line-height: 1.35; word-break: break-word; white-space: normal;
    box-shadow: 0 3px 0 var(--ivory-edge), 0 8px 18px rgba(0, 0, 0, 0.5);
    animation: bubble 3.4s cubic-bezier(0.2, 1, 0.3, 1) forwards;
    pointer-events: none;
  }
  .seat-bubble::before {
    content: ""; position: absolute; top: -6px; left: 16px; width: 12px; height: 12px;
    background: var(--ivory); transform: rotate(45deg); border-radius: 2px;
  }
  @keyframes bubble {
    0% { transform: translateY(-8px) scale(0.6); opacity: 0; }
    8% { transform: translateY(0) scale(1.06); opacity: 1; }
    14%, 86% { transform: none; opacity: 1; }
    100% { transform: translateY(-4px); opacity: 0; }
  }

  /* chat: bottom sheet on phones, floating panel on desktop (game stays playable) */
  .chat { position: fixed; inset: 0; z-index: 45; display: flex; align-items: flex-end; justify-content: center; background: rgba(3, 4, 5, 0.45); }
  .chat-panel {
    width: min(520px, 100%); height: min(64vh, 520px);
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
    border-radius: 22px 22px 0 0;
    background: linear-gradient(180deg, #1e2128, #121418);
    box-shadow: 0 0 0 1px rgba(224, 169, 59, 0.4), 0 -20px 50px rgba(0, 0, 0, 0.6);
    animation: sheetUp 0.32s cubic-bezier(0.2, 1, 0.3, 1);
  }
  @keyframes sheetUp { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @media (min-width: 900px) {
    .chat { background: transparent; pointer-events: none; justify-content: flex-end; align-items: flex-end; padding: 0 24px 24px 0; }
    .chat-panel { pointer-events: auto; width: 360px; height: 460px; border-radius: 20px; }
  }
  .chat-head { display: flex; align-items: center; justify-content: space-between; }
  .chat-title { font: 400 20px var(--f-display); }
  .chat-list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 4px; user-select: text; -webkit-user-select: text; }
  .chat-empty { margin: auto; font: 400 12px var(--f-game); color: var(--text-dim); letter-spacing: 0.1em; }
  .chat-msg { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-width: 82%; }
  .chat-msg.me { align-self: flex-end; align-items: flex-end; }
  .chat-name { font: 700 11px var(--f-ui); padding: 0 4px; }
  .chat-text {
    padding: 8px 12px; border-radius: 14px 14px 14px 4px;
    background: #2a2e36; color: var(--text); font: 500 14px var(--f-ui); line-height: 1.4; word-break: break-word;
  }
  .chat-msg.me .chat-text { border-radius: 14px 14px 4px 14px; background: linear-gradient(180deg, #ffe7a6, var(--brass-hi)); color: #2a1a04; }
  .chat-msg.new { animation: rowIn 0.35s cubic-bezier(0.2, 1, 0.3, 1); }
  .chat-quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chat-quick::-webkit-scrollbar { display: none; }
  .chat-chip { flex: none; padding: 7px 12px; border-radius: 999px; background: #0d0e11; box-shadow: inset 0 0 0 1px rgba(224, 169, 59, 0.3); color: var(--brass-hi); font: 600 13px var(--f-ui); }
  .chat-chip:active { transform: scale(0.95); }
  .chat-form { display: flex; gap: 8px; }
  .chat-form .btn { min-height: 46px; padding: 0 16px; font-size: 16px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(180deg, var(--lacquer-hi), var(--lacquer));
    box-shadow: inset 0 0 0 1.5px rgba(224, 169, 59, 0.4), 0 3px 0 #050607, 0 6px 12px rgba(0, 0, 0, 0.4);
    color: var(--brass-hi);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .icon-btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 1.5px rgba(224, 169, 59, 0.4), 0 0 0 #050607; }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ================= Table ================= */
  .table {
    grid-area: table; min-height: 0; position: relative;
    border-radius: 28px; padding: 10px;
    background:
      repeating-linear-gradient(100deg, rgba(0, 0, 0, 0.0) 0 7px, rgba(0, 0, 0, 0.09) 7px 9px, rgba(255, 210, 160, 0.04) 9px 13px),
      linear-gradient(160deg, #80502a 0%, #4a2b14 35%, #6e4120 62%, #3a210f 100%);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 22px 44px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 220, 170, 0.35), inset 0 -2px 0 rgba(0, 0, 0, 0.4);
  }
  #diceStage {
    position: relative; height: 100%; min-height: 150px;
    border-radius: 19px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #16705a 0%, #0f4f40 55%, #082c23 100%);
    box-shadow: inset 0 0 0 2px rgba(224, 169, 59, 0.55);
  }
  #diceStage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 4;
    box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(224, 169, 59, 0.55), inset 0 0 0 5px rgba(0, 0, 0, 0.25);
  }
  #diceCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .cap {
    position: absolute; top: 12px; z-index: 5; pointer-events: none;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(4, 18, 14, 0.55);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    font: 400 12px var(--f-game); letter-spacing: 0.04em; white-space: nowrap;
    max-width: 60%; overflow: hidden; text-overflow: ellipsis;
  }
  .cap-l { left: 12px; }
  .cap-r { right: 12px; color: var(--brass-hi); }

  .slot-layer { position: absolute; inset: 0; z-index: 3; }
  .slot-btn { position: absolute; border-radius: 18px; cursor: default; }
  .slot-btn.can { cursor: pointer; }
  .slot-btn.can:active { background: rgba(255, 255, 255, 0.05); }
  .slot-hold {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    padding: 3px 8px; border-radius: 999px;
    background: var(--brass-hi); color: #2a1a04;
    font: 400 9px var(--f-game); letter-spacing: 0.08em;
    box-shadow: 0 0 14px rgba(255, 215, 122, 0.8), 0 2px 0 #8a5a12;
  }
  .slot-hold.pop { animation: holdPop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes holdPop { 0% { transform: translateX(-50%) scale(0.3); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }


  .combo-chip {
    position: absolute; top: 48px; left: 50%; z-index: 5; pointer-events: none;
    transform: translateX(-50%);
    padding: 7px 16px; border-radius: 999px; white-space: nowrap;
    font: 400 14px var(--f-game); letter-spacing: 0.06em;
    color: #072a20; background: linear-gradient(180deg, #b6ffe4, var(--mint));
    box-shadow: 0 3px 0 #1c8a63, 0 0 24px rgba(63, 224, 169, 0.6);
  }
  .combo-chip[data-tone="gold"] { color: #3a2304; background: linear-gradient(180deg, #fff1c2, var(--brass-hi)); box-shadow: 0 3px 0 #9a6514, 0 0 24px rgba(255, 215, 122, 0.7); }
  .combo-chip.go { animation: chipIn 1.6s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  @keyframes chipIn {
    0% { transform: translateX(-50%) translateY(-14px) scale(0.5); opacity: 0; }
    15% { transform: translateX(-50%) translateY(0) scale(1.15); opacity: 1; }
    25%, 80% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) translateY(-10px) scale(0.95); opacity: 0; }
  }

  .turn-sweep {
    position: absolute; left: 0; right: 0; top: 50%; z-index: 5; pointer-events: none;
    transform: translateY(-50%); padding: 14px 0; text-align: center;
    background: linear-gradient(90deg, transparent, rgba(3, 12, 10, 0.88) 18%, rgba(3, 12, 10, 0.88) 82%, transparent);
  }
  .turn-sweep span { font-family: var(--f-display); font-size: clamp(24px, 6vw, 40px); text-shadow: 0 0 22px currentColor; }
  .turn-sweep.go { animation: sweep 1.1s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
  @keyframes sweep {
    0% { clip-path: inset(0 100% 0 0); }
    22%, 70% { clip-path: inset(0 0 0 0); opacity: 1; }
    100% { clip-path: inset(0 0 0 100%); opacity: 0.5; }
  }

  .loader {
    position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; align-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 42%, #16705a 0%, #0f4f40 55%, #082c23 100%);
    font: 400 13px var(--f-game); color: rgba(255, 255, 255, 0.75); letter-spacing: 0.08em;
  }
  .loader-die {
    width: 46px; height: 46px; border-radius: 11px; background: var(--ivory);
    box-shadow: inset 0 -4px 0 var(--ivory-lo), 0 8px 18px rgba(0, 0, 0, 0.4);
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 8px; place-items: center;
    animation: loaderSpin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }
  .loader-die i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .loader-die i.o { background: transparent; }
  @keyframes loaderSpin { 0% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(180deg); } 100% { transform: translateY(0) rotate(360deg); } }

  /* 2D fallback dice (no WebGL) */
  .dice2d { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 3%; padding: 0 5%; }
  .die2d {
    position: relative; width: min(15%, 84px); aspect-ratio: 1; border-radius: 20%;
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 14%; place-items: center;
    background: linear-gradient(145deg, #fffdf7, #e5dccb);
    box-shadow: 0 9px 16px rgba(0, 0, 0, 0.45), inset 0 -4px 0 rgba(0, 0, 0, 0.12);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .die2d i { width: 72%; aspect-ratio: 1; border-radius: 50%; background: #15171c; }
  .die2d i.o { background: transparent; }
  .die2d i.r { background: var(--ruby); width: 90%; }
  .die2d.held { transform: translateY(-12%); background: linear-gradient(145deg, #fff6d0, #f3cf68); box-shadow: 0 0 20px rgba(255, 215, 122, 0.7), 0 12px 18px rgba(0, 0, 0, 0.45); }
  .die2d.hl { box-shadow: 0 0 0 3px var(--mint), 0 0 20px rgba(63, 224, 169, 0.6), 0 9px 16px rgba(0, 0, 0, 0.45); }
  .die2d.rolling { animation: tumble 0.36s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
  .die2d .slot-hold { bottom: -26px; }
  @keyframes tumble { 0% { transform: rotate(0); } 33% { transform: translateY(-16px) rotate(-16deg) scale(1.1); } 66% { transform: translateY(-6px) rotate(12deg); } 100% { transform: rotate(0); } }

  /* ================= Tray: score tiles ================= */
  .tray { grid-area: tray; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .bonus { display: flex; align-items: center; gap: 9px; font: 400 10px var(--f-game); color: var(--text-dim); letter-spacing: 0.06em; }
  .bonus-bar { flex: 1; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6); overflow: hidden; }
  .bonus-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); transition: width 0.7s cubic-bezier(0.2, 0.9, 0.3, 1); }
  .bonus-num { color: var(--text); min-width: 4.2em; text-align: right; }
  .bonus.done .bonus-bar i { background: linear-gradient(90deg, var(--mint), #c6fff0); box-shadow: 0 0 10px var(--mint); }
  .bonus.done .bonus-num { color: var(--mint); }

  .tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px 6px; }
  .tile {
    position: relative; min-width: 0; min-height: 68px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 7px 2px 6px; border-radius: 12px;
    color: var(--ink);
    background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-lo) 100%);
    box-shadow: 0 4px 0 var(--ivory-edge), 0 7px 12px rgba(0, 0, 0, 0.4), inset 0 1px 0 #fff;
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.25s ease;
  }
  .t-ico { height: 16px; display: grid; place-items: center; color: #4a4336; }
  .t-ico svg { width: 16px; height: 16px; display: block; }
  .t-ico b { font: 400 9px var(--f-game); letter-spacing: -0.02em; font-weight: 400; }

  .tile.is-idle { filter: brightness(0.62) saturate(0.7); }

  .tile.is-live:hover { transform: translateY(-3px); box-shadow: 0 7px 0 var(--ivory-edge), 0 12px 16px rgba(0, 0, 0, 0.45), inset 0 1px 0 #fff; }
  .tile.is-live:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ivory-edge), 0 3px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 #fff; }
  .tile.is-hot { animation: hotTile 1.1s ease-in-out infinite; }

  .tile.is-sel {
    transform: translateY(-7px);

  }
  .tile.is-sel::before {
    content: "한 번 더 탭"; position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%);
    padding: 4px 8px; border-radius: 8px; white-space: nowrap; z-index: 2;

    box-shadow: 0 2px 0 #8a5a12;
  }
  .tile.is-filled {
    color: var(--brass-hi);
    background: linear-gradient(180deg, #2b2720 0%, #1a1814 100%);

  }
  .tile.is-filled .t-ico, .tile.is-filled .t-name { color: rgba(224, 169, 59, 0.55); }
  .tile.is-filled.is-zero .t-val { color: #6b6455; }
  .tile.is-flip { animation: tileFlip 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes hotTile {
    0%, 100% { box-shadow: 0 4px 0 var(--ivory-edge), 0 7px 12px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 215, 122, 0.4); }
    50% { box-shadow: 0 4px 0 var(--ivory-edge), 0 7px 12px rgba(0, 0, 0, 0.4), 0 0 0 3px var(--brass-hi), 0 0 22px rgba(255, 215, 122, 0.7); }
  }
  @keyframes starTwinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(18deg); } }
  @keyframes tileFlip { 0% { transform: perspective(300px) rotateX(-100deg) scale(1.1); } 100% { transform: perspective(300px) rotateX(0) scale(1); } }

  @media (min-width: 900px) and (min-aspect-ratio: 1/1) {

  /* ================= Action: roll button ================= */
  .action { grid-area: action; display: flex; min-width: 0; }
  .roll {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    min-height: 66px; padding: 8px 18px; border-radius: 20px;
    color: #fff;
    background: linear-gradient(180deg, #ff6478 0%, var(--ruby) 55%, var(--ruby-lo) 100%);
    box-shadow: 0 6px 0 #7e0d22, 0 14px 26px rgba(224, 49, 75, 0.38), inset 0 2px 0 rgba(255, 255, 255, 0.45), inset 0 -2px 0 rgba(0, 0, 0, 0.15);
    transition: transform 0.08s, box-shadow 0.08s, filter 0.2s;
    margin-bottom: 6px;
  }
  .roll:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #7e0d22, 0 4px 10px rgba(224, 49, 75, 0.3), inset 0 2px 0 rgba(255, 255, 255, 0.45); }
  .roll:disabled {
    color: #8f8a80;
    background: linear-gradient(180deg, #2b2e35, #1c1e23);
    box-shadow: 0 6px 0 #0b0c0e, inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  .roll-txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
  .roll-main { font: 400 26px var(--f-game); letter-spacing: 0.03em; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
  .roll-pips { display: flex; gap: 7px; }
  .roll-pips i { width: 13px; height: 13px; border-radius: 50%; background: #fff; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2), 0 0 8px rgba(255, 255, 255, 0.6); }
  .roll-pips i.off { background: rgba(0, 0, 0, 0.3); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
  .roll-pips i.burst { animation: pipBurst 0.5s ease-out; }
  .roll:disabled .roll-pips i:not(.off) { background: #6b675f; box-shadow: none; }
  .roll::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 34%; left: -50%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
    transform: skewX(-20deg); pointer-events: none; opacity: 0;
  }
  .roll.is-ready::after { opacity: 1; animation: shine 2.2s ease-in-out infinite; }
  .roll.is-ready { animation: rollPulse 1.5s ease-in-out infinite; }
  @keyframes shine { 0% { left: -50%; } 55%, 100% { left: 130%; } }
  @keyframes rollPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  @keyframes pipBurst { 0% { transform: scale(2); background: #fff; } 100% { transform: scale(1); } }
  @media (min-width: 900px) and (min-aspect-ratio: 1/1) {
    .roll { flex-direction: column; gap: 10px; border-radius: 24px; }
    .roll-txt { align-items: center; }
    .roll-main { font-size: 34px; }
  }

  /* ================= Overlays ================= */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

  }

    padding: 20px;

  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }

  .logo { text-align: center; margin: 4px 0 20px; }

  .btn-stack { display: flex; flex-direction: column; gap: 11px; }

  /* title screen */

  .title-wrap .btn-stack > * { animation: rowIn 0.5s cubic-bezier(0.2, 1, 0.3, 1) both; }

  .btn.btn-xl { min-height: 78px; flex-direction: column; gap: 3px; font-size: 30px; }
  .btn-xl small { font: 600 12px var(--f-ui); opacity: 0.85; letter-spacing: 0; }
  .btn-xl:not(:disabled) { animation: rowIn 0.5s cubic-bezier(0.2, 1, 0.3, 1) both, rollPulse 1.6s ease-in-out 0.8s infinite; }
  .title-foot { margin: 0; text-align: center; min-height: 1em; font: 400 11px var(--f-game); color: var(--brass-hi); letter-spacing: 0.12em; }
  @keyframes logoIn { 0% { transform: translateY(-30px) scale(1.5); opacity: 0; filter: blur(8px); } 100% { transform: none; opacity: 1; filter: none; } }
  .btn {

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .mode-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 16px; }

  .field-label { display: block; font: 600 12px var(--f-ui); color: var(--text-dim); margin-bottom: 7px; }

  /* ================= Big moments ================= */

  <script>
    (function () {
      'use strict';

      // ================= Rules data =================
      const CATEGORIES = [
        { id: 'ones', name: 'ACES', ko: '에이스', desc: '1이 나온 주사위의 합', section: 'upper', face: 1 },

        { id: 'threes', name: 'THREES', ko: '트레이', desc: '3이 나온 주사위의 합', section: 'upper', face: 3 },
        { id: 'fours', name: 'FOURS', ko: '포', desc: '4가 나온 주사위의 합', section: 'upper', face: 4 },
        { id: 'fives', name: 'FIVES', ko: '파이브', desc: '5가 나온 주사위의 합', section: 'upper', face: 5 },
        { id: 'sixes', name: 'SIXES', ko: '식스', desc: '6이 나온 주사위의 합', section: 'upper', face: 6 },
        { id: 'choice', name: 'CHOICE', ko: '초이스', desc: '주사위 5개의 합', section: 'lower', glyph: 'ALL' },
        { id: 'fourKind', name: '4 KIND', ko: '포카인드', desc: '같은 눈 4개 이상이면 5개의 합', section: 'lower', glyph: '4×' },
        { id: 'fullHouse', name: 'F.HOUSE', ko: '풀하우스', desc: '같은 눈 3개 + 2개면 5개의 합', section: 'lower', glyph: '3+2' },
        { id: 'smallStraight', name: 'S.STR', ko: '스몰 스트레이트', desc: '연속된 숫자 4개면 15점', section: 'lower', glyph: '1234' },
        { id: 'largeStraight', name: 'L.STR', ko: '라지 스트레이트', desc: '연속된 숫자 5개면 30점', section: 'lower', glyph: '12345' },
        { id: 'yacht', name: 'YACHT', ko: '야트', desc: '5개 모두 같은 눈이면 50점', section: 'lower', glyph: '5×' }
      ];
      const UPPER_FACE = { ones: 1, twos: 2, threes: 3, fours: 4, fives: 5, sixes: 6 };
      const PLAYER_COLORS = ['#4fd1ff', '#ff6b8b', '#ffc94d', '#7cf29c'];
      const PIP_MAP = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
      const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
      function dieIcon(v) {
        const pos = [6.5, 12, 17.5];
        let s = '<svg viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/>';
        PIP_MAP[v].forEach(function (c) {
          s += '<circle cx="' + pos[c % 3] + '" cy="' + pos[Math.floor(c / 3)] + '" r="' + (v === 1 ? 3.2 : 2.1) + '" fill="' + (v === 1 ? '#e0314b' : 'currentColor') + '"/>';
        });
        return s + '</svg>';
      }

      // ================= Audio (Web Audio synth) =================
      let audioCtx = null, bus = null, noiseBuf = null, isMuted = false, lastClack = 0;

      let gestured = false;
      function ensureAudio() {
        if (!audioCtx && !gestured) return; // browsers only allow audio after the first tap/key
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          try { audioCtx = new AC(); } catch (e) { return; }
          const comp = audioCtx.createDynamicsCompressor();
          comp.threshold.value = -14;
          comp.ratio.value = 6;
          comp.connect(audioCtx.destination);
          bus = audioCtx.createGain();
          bus.gain.value = 0.9;
          bus.connect(comp);
          const len = Math.floor(audioCtx.sampleRate * 0.6);
          noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const ch = noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
      }
      function tone(freq, dur, type, vol, slide, delay) {
        if (isMuted || !audioCtx) return;
        try {
          const t = audioCtx.currentTime + (delay || 0);
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, t);
          if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          osc.connect(g); g.connect(bus);
          osc.start(t); osc.stop(t + dur + 0.03);
        } catch (e) {}
      }
      function noise(freq, q, dur, vol, ftype, delay, sweepTo) {
        if (isMuted || !audioCtx || !noiseBuf) return;
        try {
          const t = audioCtx.currentTime + (delay || 0);
          const src = audioCtx.createBufferSource();
          src.buffer = noiseBuf;
          const f = audioCtx.createBiquadFilter();
          f.type = ftype || 'bandpass';
          f.frequency.setValueAtTime(freq, t);
          if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
          f.Q.value = q || 1;
          const g = audioCtx.createGain();
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f); f.connect(g); g.connect(bus);
          src.start(t, Math.random() * 0.4, dur + 0.05);
        } catch (e) {}
      }
      function sfxClack(v, kind) {
        if (!audioCtx) return;
        const now = performance.now();
        if (now - lastClack < 16) return;
        lastClack = now;
        const vol = Math.min(0.5, 0.05 + v * 0.02);
        if (kind === 'die') {
          noise(2600 + Math.random() * 1800, 5, 0.04, vol, 'bandpass');
          tone(1500 + Math.random() * 700, 0.035, 'triangle', vol * 0.35);
        } else if (kind === 'wall') {
          noise(1100 + Math.random() * 400, 2.5, 0.07, vol * 0.9, 'bandpass');
          tone(300 + Math.random() * 60, 0.07, 'triangle', vol * 0.4, 200);
          if (v > 6 && !REDUCED) restartAnim(tableEl, 'thump');
        } else {
          noise(900 + Math.random() * 400, 0.9, 0.07, vol * 0.8, 'lowpass');
          tone(150 + Math.random() * 50, 0.08, 'sine', vol * 0.5, 80);
        }
        if (v > 12) buzz(8);
      }
      function sfxRattle() {
        ensureAudio();
        for (let i = 0; i < 9; i++) noise(2400 + Math.random() * 2000, 4, 0.03, 0.1 + Math.random() * 0.08, 'bandpass', i * 0.028 + Math.random() * 0.01);
        noise(500, 0.7, 0.28, 0.08, 'bandpass', 0, 2600);
      }
      function sfxHold(isHeld) {
        ensureAudio();
        tone(isHeld ? 620 : 420, 0.07, 'sine', 0.09, isHeld ? 900 : 280);
        if (isHeld) tone(1240, 0.05, 'triangle', 0.03, 0, 0.03);
        else noise(900, 1, 0.05, 0.12, 'lowpass', 0.05);
      }
      function sfxTick() { ensureAudio(); tone(980, 0.04, 'triangle', 0.05); }
      function sfxLand(k) { tone(520 * Math.pow(2, (k * 2) / 12), 0.07, 'triangle', 0.045); }
      function sfxScore(pts) {
        ensureAudio();
        if (pts >= 50) {
          [523, 659, 784, 1046, 1318].forEach(function (f, i) { tone(f, 0.22, 'triangle', 0.1, 0, i * 0.07); });
          tone(2093, 0.5, 'sine', 0.04, 0, 0.36);
        } else if (pts >= 25) {
          tone(523, 0.12, 'triangle', 0.09); tone(659, 0.12, 'triangle', 0.09, 0, 0.07); tone(988, 0.2, 'triangle', 0.08, 0, 0.14);
        } else if (pts > 0) {
          tone(440, 0.09, 'sine', 0.08, 560); tone(880, 0.08, 'triangle', 0.03, 0, 0.05);
        } else {
          tone(260, 0.28, 'sawtooth', 0.035, 130);
        }
      }
      function sfxWhoosh() { ensureAudio(); noise(300, 0.8, 0.4, 0.13, 'bandpass', 0, 3200); }
      function sfxCombo(level) {
        ensureAudio();
        const base = level >= 2 ? 659 : 523;
        [0, 4, 7, 12].slice(0, 2 + level).forEach(function (s, i) { tone(base * Math.pow(2, s / 12), 0.14, 'square', 0.03, 0, i * 0.06); });
      }
      function sfxWin() {
        ensureAudio();
        [523, 659, 784, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.24, 'triangle', 0.1, 0, i * 0.11); });
      }

      // ================= Game state =================
      let selectedMode = 'ai';
      let matchMode = 'ai';
      let localCount = 2;
      let players = [];
      let currentPlayerIdx = 0;
      let round = 1;
      let dice = [1, 2, 3, 4, 5];
      let held = [false, false, false, false, false];
      let rollsLeft = 3;
      let hasRolledThisTurn = false;
      let isRolling = false;
      let isScoring = false;
      let gameActive = false;
      let aiTimer = null;
      let matchId = 0;

      // view-only
      let displayDice = null;
      let fallbackRolling = false;
      let hlIndices = null;
      let lastScored = null;
      let selectedTile = null;
      let lastPointer = '';
      let prevHeld = [false, false, false, false, false];
      let prevRollsLeft = 3;
      let totalDelayUntil = 0;
      const totalAnims = {};
      let totalsRaf = 0;

      // online (Firebase)
      let isOnlineMatch = false;
      let onlineRole = null;
      let myPeerId = null;
      let roomCode = '';
      let lobbyMembers = [];

      // DOM
      const $ = function (id) { return document.getElementById(id); };
      const appEl = $('app');
      const tableEl = $('table');
      const seatsEl = $('seats');
      const diceGrid = $('diceGrid');
      const tilesEl = $('tiles');
      const rollBtn = $('rollBtn');
      const rollMain = $('rollMain');
      const rollPips = $('rollPips');
      const turnCap = $('turnCap');
      const roundCap = $('roundCap');
      const comboBanner = $('comboBanner');
      const comboChip = $('comboChip');
      const turnSweep = $('turnSweep');
      const screenFlash = $('screenFlash');
      const toastEl = $('toast');
      const loader = $('loader');
      const bonusEl = $('bonus');
      const bonusFill = $('bonusFill');
      const bonusTxt = $('bonusTxt');

      const titleOv = $('titleOv');
      const menuOv = $('menuOv');
      const modeOv = $('modeOv');
      const rulesOv = $('rulesOv');
      const sheetOv = $('sheetOv');
      const resultOv = $('resultOv');
      const OVERLAYS = [titleOv, menuOv, modeOv, rulesOv, sheetOv, resultOv];
      const muteBtn = $('muteBtn');

      const namesEl = $('names');
      const onlineNickname = $('onlineNickname');
      const onlineChoice = $('onlineChoice');
      const onlineLobby = $('onlineLobby');
      const displayRoomCode = $('displayRoomCode');
      const lobbyList = $('lobbyList');
      const onlineStatus = $('onlineStatus');
      const startOnlineBtn = $('startOnlineBtn');
      const joinRoomInput = $('joinRoomInput');

      const tileEls = {};

      function use3D() { return !!(window.Dice3D && window.Dice3D.ok); }
      function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.hidden = false;
        restartAnim(toastEl, 'toast');
        clearTimeout(toastEl._t);
        toastEl._t = setTimeout(function () { toastEl.hidden = true; }, 2800);
      }
      function openOv(el) { el.hidden = false; }
      function closeOv(el) { el.hidden = true; }
      function anyOverlay() { return OVERLAYS.some(function (o) { return !o.hidden; }); }

      function isMyTurn() {
        if (!gameActive || !players[currentPlayerIdx]) return false;
        const cur = players[currentPlayerIdx];
        if (cur.isAI) return false;
        if (!isOnlineMatch) return true;
        return cur.peerId === myPeerId;
      }
      function canScoreNow() { return gameActive && hasRolledThisTurn && !isRolling && !isScoring && isMyTurn(); }

      // ================= Scoring =================
      function countsOf(d) {
        const c = [0, 0, 0, 0, 0, 0, 0];
        for (let i = 0; i < 5; i++) c[d[i]]++;
        return c;
      }
      function straightStart(counts, len) {
        for (let s = 1; s + len - 1 <= 6; s++) {
          let ok = true;
          for (let v = s; v < s + len; v++) if (!counts[v]) { ok = false; break; }
          if (ok) return s;
        }
        return 0;
      }
      function calcCategoryScore(catId, d) {
        const counts = countsOf(d);
        let sum = 0;
        for (let i = 0; i < 5; i++) sum += d[i];
        if (UPPER_FACE[catId]) return counts[UPPER_FACE[catId]] * UPPER_FACE[catId];
        if (catId === 'choice') return sum;
        if (catId === 'fourKind') { for (let v = 1; v <= 6; v++) if (counts[v] >= 4) return sum; return 0; }
        if (catId === 'fullHouse') {
          let has3 = false, has2 = false, has5 = false;
          for (let v = 1; v <= 6; v++) { if (counts[v] === 5) has5 = true; if (counts[v] === 3) has3 = true; if (counts[v] === 2) has2 = true; }
          return (has5 || (has3 && has2)) ? sum : 0;
        }
        if (catId === 'smallStraight') return straightStart(counts, 4) ? 15 : 0;
        if (catId === 'largeStraight') return straightStart(counts, 5) ? 30 : 0;
        if (catId === 'yacht') { for (let v = 1; v <= 6; v++) if (counts[v] === 5) return 50; return 0; }
        return 0;
      }
      function contributingDice(catId, d) {
        const all = [0, 1, 2, 3, 4];
        if (calcCategoryScore(catId, d) === 0) return [];
        if (UPPER_FACE[catId]) return all.filter(function (i) { return d[i] === UPPER_FACE[catId]; });
        if (catId === 'fourKind') {
          const counts = countsOf(d);
          let v = 1;
          for (let k = 1; k <= 6; k++) if (counts[k] >= 4) v = k;
          return all.filter(function (i) { return d[i] === v; }).slice(0, 4);
        }
        if (catId === 'smallStraight') {
          const s = straightStart(countsOf(d), 4);
          const out = [];
          for (let v = s; v < s + 4; v++) out.push(d.indexOf(v));
          return out;
        }
        return all;
      }
      function getPlayerTotals(player) {
        let upper = 0, lower = 0;
        CATEGORIES.forEach(function (cat) {
          const val = player.scores[cat.id];
          if (val !== null && val !== undefined) { if (cat.section === 'upper') upper += val; else lower += val; }
        });
        const bonus = upper >= 63 ? 35 : 0;
        return { upper: upper, bonus: bonus, lower: lower, total: upper + bonus + lower };
      }

      // ================= Juice =================
      function showBanner(title, sub, tier) {
        comboBanner.querySelector('.b-title').textContent = title;
        const subEl = comboBanner.querySelector('.b-sub');
        subEl.textContent = sub || '';
        subEl.hidden = !sub;
        comboBanner.dataset.tier = tier || 'hot';
        comboBanner.hidden = false;
        restartAnim(comboBanner, 'banner-anim');
        sfxWhoosh();
        clearTimeout(comboBanner._t);
        comboBanner._t = setTimeout(function () { comboBanner.hidden = true; }, 2000);
      }
      function showChip(text, tone) {
        comboChip.textContent = text;
        comboChip.dataset.tone = tone || 'cool';
        comboChip.hidden = false;
        restartAnim(comboChip, 'go');
        clearTimeout(comboChip._t);
        comboChip._t = setTimeout(function () { comboChip.hidden = true; }, 1600);
      }
      function showTurnSweep(name, idx) {
        if (players.length < 2) return;
        const span = turnSweep.querySelector('span');
        span.textContent = name + ' 차례';
        span.style.color = PLAYER_COLORS[idx % PLAYER_COLORS.length];
        turnSweep.hidden = false;
        restartAnim(turnSweep, 'go');
        clearTimeout(turnSweep._t);
        turnSweep._t = setTimeout(function () { turnSweep.hidden = true; }, 1100);
      }
      function flashScreen() { if (!REDUCED) restartAnim(screenFlash, 'go'); }
      function bigShake() { if (!REDUCED) restartAnim(appEl, 'shake'); }
      function fireConfetti(big) {
        if (typeof confetti !== 'function') return;
        try {
          const colors = ['#ffd77a', '#e0a93b', '#e0314b', '#3fe0a9', '#fbf6e8'];
          confetti({ particleCount: big ? 120 : 50, spread: big ? 85 : 60, origin: { y: 0.55 }, colors: colors, disableForReducedMotion: true });
          if (big) {
            setTimeout(function () { confetti({ particleCount: 60, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors: colors, disableForReducedMotion: true }); }, 180);
            setTimeout(function () { confetti({ particleCount: 60, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors: colors, disableForReducedMotion: true }); }, 300);
            if (typeof confetti.shapeFromText === 'function') {
              const die = confetti.shapeFromText({ text: '🎲', scalar: 2.2 });
              confetti({ shapes: [die], scalar: 2.2, particleCount: 18, spread: 100, origin: { y: 0.5 }, disableForReducedMotion: true });
            }
          }
        } catch (e) {}
      }

      // "+18" lifts off the tile and flies into the player's coin
      function flyScore(catId, pIdx, pts) {
        const tile = tileEls[catId];
        const seat = seatsEl.children[pIdx];
        if (!tile) return;
        const a = tile.getBoundingClientRect();
        const target = seat ? seat.querySelector('.seat-coin') : null;
        const b = target ? target.getBoundingClientRect() : a;
        const el = document.createElement('div');
        el.className = 'fly-pts';
        el.textContent = pts > 0 ? '+' + pts : '0';
        el.style.color = pts >= 25 ? '#ffd77a' : pts > 0 ? '#8ff5cf' : '#8a8577';
        document.body.appendChild(el);
        const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2;
        const x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
        const T = function (x, y, s) { return 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(' + s + ')'; };
        const land = function () {
          el.remove();
          if (seat) restartAnim(seat, 'is-hit');
          tone(1320, 0.06, 'triangle', 0.05);
        };
        if (!el.animate || REDUCED) { el.style.transform = T(x0, y0 - 30, 1); setTimeout(land, 500); return; }
        const big = pts >= 50 ? 1.7 : 1.3;
        const anim = el.animate([
          { transform: T(x0, y0, 0.4), opacity: 0 },
          { transform: T(x0, y0 - 36, big), opacity: 1, offset: 0.22 },
          { transform: T(x0, y0 - 46, 1), opacity: 1, offset: 0.45 },
          { transform: T(x1, y1, 0.5), opacity: 0.9 }
        ], { duration: 1000, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'forwards' });
        anim.onfinish = land;
      }

      function setHighlight(arr, color) {
        hlIndices = arr && arr.length ? arr : null;
        if (use3D()) window.Dice3D.highlight(hlIndices, color || '#3fe0a9');
        else renderDice();
      }
      function celebrate(arr) { if (use3D() && arr && arr.length) window.Dice3D.celebrate(arr); }

      // count-up totals on the coins (start when the flying score lands)
      function totalValue(a, now) {
        const p = Math.max(0, Math.min(1, (now - a.t0) / 700));
        return a.from + (a.to - a.from) * (1 - Math.pow(1 - p, 3));
      }
      function displayedTotal(idx, target) {
        const now = performance.now();
        let a = totalAnims[idx];
        if (!a) a = totalAnims[idx] = { from: target, to: target, t0: now - 1000, bumped: true };
        if (a.to !== target) {
          a.from = totalValue(a, now);
          a.to = target;
          a.t0 = Math.max(now, totalDelayUntil);
          a.bumped = false;
          kickTotals();
        }
        return Math.round(totalValue(a, now));
      }
      function kickTotals() {
        if (totalsRaf) return;
        const loop = function () {
          let active = false;
          const now = performance.now();
          seatsEl.querySelectorAll('[data-total-idx]').forEach(function (el) {
            const a = totalAnims[+el.dataset.totalIdx];
            if (!a) return;
            el.textContent = String(Math.round(totalValue(a, now)));
            if (!a.bumped && now >= a.t0) { a.bumped = true; restartAnim(el, 'bump'); }
            if (now < a.t0 + 700) active = true;
          });
          totalsRaf = active ? requestAnimationFrame(loop) : 0;
        };
        totalsRaf = requestAnimationFrame(loop);
      }
      function resetTotalAnims() { Object.keys(totalAnims).forEach(function (k) { delete totalAnims[k]; }); }

      // ================= Build static pieces =================
      function tileInner(cat) {
        return '<span class="t-ico">' + (cat.face ? dieIcon(cat.face) : '<b>' + cat.glyph + '</b>') + '</span>' +
          '<span class="t-val"></span><span class="t-name">' + cat.name + '</span><span class="t-star" aria-hidden="true">★</span>';
      }
      function buildTiles() {
        CATEGORIES.forEach(function (cat) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'tile is-idle';
          b.dataset.cat = cat.id;
          b.innerHTML = tileInner(cat);
          b.addEventListener('pointerdown', function (e) { lastPointer = e.pointerType || ''; });
          b.addEventListener('pointerenter', function (e) {
            if (e.pointerType === 'mouse' && canScoreNow() && b.classList.contains('is-open')) {
              setHighlight(contributingDice(cat.id, dice), b.classList.contains('is-hot') ? '#ffd77a' : '#3fe0a9');
            }
          });
          b.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && selectedTile !== cat.id) setHighlight(null); });
          b.addEventListener('click', function () {
            if (!canScoreNow()) return;
            const cur = players[currentPlayerIdx];
            if (!cur || cur.scores[cat.id] !== null) return;
            // touch: first tap previews (dice light up), second tap confirms
            if (lastPointer === 'touch' && selectedTile !== cat.id) {
              selectedTile = cat.id;
              setHighlight(contributingDice(cat.id, dice), '#ffd77a');
              sfxTick();
              buzz(6);
              renderTiles();
              return;
            }
            handleScoreInput(cat.id);
          });
          tilesEl.appendChild(b);
          tileEls[cat.id] = b;
        });
      }
      function buildRules() {
        const list = $('rulesList');
        CATEGORIES.forEach(function (cat) {
          const row = document.createElement('div');
          row.className = 'rule';
          row.innerHTML = '<div class="tile">' + tileInner(cat) + '</div><div class="rule-txt"><b>' + cat.ko + '</b><span>' + cat.desc + '</span></div>';
          list.appendChild(row);
        });
      }

      // ================= Rendering =================
      function renderSeats() {
        const sig = players.map(function (p) { return (p.isAI ? 'ai:' : '') + p.name + (p.peerId || ''); }).join('|');
        if (seatsEl.dataset.sig !== sig) {
          seatsEl.dataset.sig = sig;
          seatsEl.innerHTML = '';
          players.forEach(function (p, idx) {
            const s = document.createElement('div');
            s.className = 'seat';
            s.style.setProperty('--pc', PLAYER_COLORS[idx % PLAYER_COLORS.length]);
            s.innerHTML = '<div class="seat-coin"><span class="seat-ini"></span></div><div class="seat-meta"><span class="seat-name"></span><span class="seat-score" data-total-idx="' + idx + '">0</span></div>';
            seatsEl.appendChild(s);
          });
        }
        seatsEl.dataset.count = String(players.length);
        const initials = players.map(function (p) { return p.isAI ? 'AI' : (Array.from((p.name || '?').trim())[0] || '?').toUpperCase(); });
        players.forEach(function (p, idx) {
          const s = seatsEl.children[idx];
          if (!s) return;
          s.classList.toggle('is-turn', idx === currentPlayerIdx && gameActive);
          const clash = initials.filter(function (x) { return x === initials[idx]; }).length > 1;
          s.querySelector('.seat-ini').textContent = clash && !p.isAI ? (idx + 1) + 'P' : initials[idx];
          s.querySelector('.seat-name').textContent = p.name + (isOnlineMatch && p.peerId === myPeerId ? ' (나)' : '');
          s.querySelector('.seat-score').textContent = String(displayedTotal(idx, getPlayerTotals(p).total));
        });
      }

      function placeSlots() {
        if (!use3D()) return;
        const rects = window.Dice3D.slotRects();
        Array.prototype.forEach.call(diceGrid.children, function (b, i) {
          const r = rects[i];
          if (!r) return;
          const s = Math.max(22, r.hw * 1.05);
          b.style.left = (r.cx - s) + 'px';
          b.style.top = (r.cy - s * 1.25) + 'px';
          b.style.width = (2 * s) + 'px';
          b.style.height = (2 * s * 1.35) + 'px';
        });
      }

      function renderDice() {
        const canClick = hasRolledThisTurn && !isRolling && !isScoring && isMyTurn();

        if (use3D()) {
          const D3 = window.Dice3D;
          if (!D3.isAnimating()) D3.setState(dice, held);
          D3.setDim(gameActive && !hasRolledThisTurn && !isRolling);
          if (!canClick) D3.setHover(-1);
          diceGrid.className = 'slot-layer';
          diceGrid.innerHTML = '';
          for (let i = 0; i < 5; i++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'slot-btn' + (canClick ? ' can' : '');
            btn.setAttribute('aria-label', '주사위 ' + (i + 1) + ': ' + dice[i] + (held[i] ? ' (고정됨)' : ''));
            btn.setAttribute('aria-pressed', held[i] ? 'true' : 'false');
            if (held[i]) btn.innerHTML = '<span class="slot-hold' + (!prevHeld[i] ? ' pop' : '') + '">HOLD</span>';
            btn.addEventListener('click', function () { handleHoldInput(i); });
            btn.addEventListener('pointerenter', function (e) { if (canClick && e.pointerType === 'mouse') D3.setHover(i); });
            btn.addEventListener('pointerleave', function () { D3.setHover(-1); });
            diceGrid.appendChild(btn);
          }
          placeSlots();
        } else {
          const shown = displayDice || dice;
          diceGrid.className = 'dice2d';
          diceGrid.innerHTML = '';
          for (let i = 0; i < 5; i++) {
            const v = shown[i];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'die2d' + (held[i] ? ' held' : '') + (hlIndices && hlIndices.indexOf(i) !== -1 ? ' hl' : '') + (fallbackRolling && !held[i] ? ' rolling' : '');
            btn.setAttribute('aria-label', '주사위 ' + (i + 1) + ': ' + v + (held[i] ? ' (고정됨)' : ''));
            btn.setAttribute('aria-pressed', held[i] ? 'true' : 'false');
            let h = '';
            for (let c = 0; c < 9; c++) h += '<i class="' + (PIP_MAP[v].indexOf(c) === -1 ? 'o' : (v === 1 ? 'r' : '')) + '"></i>';
            if (held[i]) h += '<span class="slot-hold' + (!prevHeld[i] ? ' pop' : '') + '">HOLD</span>';
            btn.innerHTML = h;
            btn.addEventListener('click', function () { handleHoldInput(i); });
            diceGrid.appendChild(btn);
          }
        }
        prevHeld = held.slice();
      }

      function renderTiles() {
        const cur = players[currentPlayerIdx];
        const canSelect = canScoreNow();
        const showPreview = !!cur && hasRolledThisTurn && !isRolling && gameActive;
        if (selectedTile && (!canSelect || !cur || cur.scores[selectedTile] !== null)) selectedTile = null;

        let bestId = null, bestPts = 0;
        if (showPreview) {
          CATEGORIES.forEach(function (c) {
            if (cur.scores[c.id] !== null) return;
            const p = calcCategoryScore(c.id, dice);
            if (p > bestPts) { bestPts = p; bestId = c.id; }
          });
        }
        const flipRecent = lastScored && Date.now() - lastScored.at < 800 && lastScored.pIdx === currentPlayerIdx;

        CATEGORIES.forEach(function (c) {
          const t = tileEls[c.id];
          const vEl = t.querySelector('.t-val');
          const val = cur ? cur.scores[c.id] : null;
          let cls = 'tile';
          let label = c.ko + ' (' + c.desc + ')';
          if (val !== null && val !== undefined) {
            cls += ' is-filled' + (val === 0 ? ' is-zero' : '');
            vEl.textContent = String(val);
            label += ', 기록 ' + val + '점';
          } else if (showPreview) {
            const p = calcCategoryScore(c.id, dice);
            const hot = (c.id === 'yacht' && p === 50) || (c.id === 'largeStraight' && p === 30) || p >= 22;
            cls += ' is-open' + (canSelect ? ' is-live' : '') + (p === 0 ? ' is-zero' : '') + (hot ? ' is-hot' : '') +
              (c.id === bestId ? ' is-best' : '') + (selectedTile === c.id ? ' is-sel' : '');
            vEl.textContent = (p > 0 ? '+' : '') + p;
            label += ', ' + p + '점 기록 가능';
          } else {
            cls += ' is-idle';
            vEl.textContent = '';
          }
          if (flipRecent && lastScored.catId === c.id) cls += ' is-flip';
          if (t.className !== cls) t.className = cls;
          t.disabled = !(canSelect && val === null);
          t.setAttribute('aria-label', label);
        });

        const tt = cur ? getPlayerTotals(cur) : { upper: 0, bonus: 0 };
        bonusFill.style.width = Math.min(100, (tt.upper / 63) * 100) + '%';
        bonusTxt.textContent = tt.bonus ? '+35' : tt.upper + '/63';
        bonusEl.classList.toggle('done', tt.bonus > 0);
      }

      function renderAction() {
        const cur = players[currentPlayerIdx];
        const mine = isMyTurn();
        const canRoll = gameActive && rollsLeft > 0 && !isRolling && !isScoring && mine;
        rollBtn.disabled = gameActive ? !canRoll : false;
        rollBtn.classList.toggle('is-ready', canRoll && !hasRolledThisTurn);

        let main = 'ROLL';
        if (!gameActive) main = 'PLAY';
        else if (cur && cur.isAI) main = 'AI TURN';
        else if (isOnlineMatch && !mine) main = 'WAIT';
        else if (isRolling) main = 'ROLLING';
        else if (isScoring) main = 'NICE';
        else if (rollsLeft > 0 && hasRolledThisTurn) main = 'REROLL';
        else if (rollsLeft === 0) main = 'PICK';
        rollMain.textContent = main;

        const pips = rollPips.children;
        for (let i = 0; i < 3; i++) {
          pips[i].className = i < rollsLeft ? '' : 'off';
          if (rollsLeft < prevRollsLeft && i === rollsLeft) pips[i].classList.add('burst');
        }
        prevRollsLeft = rollsLeft;
      }

      function renderCaps() {
        const cur = players[currentPlayerIdx];
        roundCap.textContent = 'ROUND ' + Math.min(round, 12) + '/12';
        turnCap.hidden = roundCap.hidden = !players.length;
        if (!gameActive) {
          turnCap.textContent = '게임 종료';
          turnCap.style.color = '';
        } else if (cur) {
          const me = (!isOnlineMatch && !cur.isAI && players.filter(function (p) { return !p.isAI; }).length === 1) || (isOnlineMatch && cur.peerId === myPeerId);
          turnCap.textContent = me ? '나의 차례' : (cur.isAI ? 'AI 차례' : cur.name + ' 차례');
          turnCap.style.color = PLAYER_COLORS[currentPlayerIdx % PLAYER_COLORS.length];
        }
      }

      function renderSheet() {
        if (sheetOv.hidden) return;
        const curCls = function (i) { return i === currentPlayerIdx && gameActive ? ' class="cur"' : ''; };
        let html = '<table class="pad-table"><thead><tr><th></th>' + players.map(function (p, i) {
          return '<th' + curCls(i) + ' style="color:' + PLAYER_COLORS[i % 4] + '">' + esc(p.name) + '</th>';
        }).join('') + '</tr></thead><tbody>';
        CATEGORIES.forEach(function (c, ci) {
          html += '<tr><th>' + c.name + '</th>' + players.map(function (p, i) {
            const v = p.scores[c.id];
            return '<td' + curCls(i) + '>' + (v === null ? '<span class="dash">·</span>' : v) + '</td>';
          }).join('') + '</tr>';
          if (ci === 5) {
            html += '<tr class="sub"><th>BONUS</th>' + players.map(function (p, i) {
              const t = getPlayerTotals(p);
              return '<td' + curCls(i) + '>' + (t.bonus ? '+35' : t.upper + '/63') + '</td>';
            }).join('') + '</tr>';
          }
        });
        html += '<tr class="total"><th>TOTAL</th>' + players.map(function (p, i) {
          return '<td' + curCls(i) + '>' + getPlayerTotals(p).total + '</td>';
        }).join('') + '</tr></tbody></table>';

      // ================= Online sync =================
      function broadcastState() {

      function broadcastFx(kind, extra) {

      function fx(kind, extra) { applyFx(kind, extra || {}); broadcastFx(kind, extra); }

        if (kind === 'roll') {
          playRoll(extra.values, extra.held, function () { renderDice(); postRollFx(extra.values); });
        } else if (kind === 'hold') {
          sfxHold(extra.held);
        } else if (kind === 'score') {
          sfxScore(extra.pts);
          lastScored = { catId: extra.catId, pIdx: extra.pIdx, at: Date.now() };

          fireConfetti(extra.big);

      // ================= Rolling =================

        sfxRattle();

          const willYacht = values.every(function (v) { return v === values[0]; }) && heldSnap.some(function (h) { return !h; });
          window.Dice3D.roll(values, heldSnap, { drama: willYacht, onImpact: sfxClack, onLand: sfxLand, onDone: done });
          return;
        }
        let ticks = 0;
        displayDice = dice.slice();
        fallbackRolling = true;
        const iv = setInterval(function () {
          for (let i = 0; i < 5; i++) if (!heldSnap[i]) displayDice[i] = 1 + Math.floor(Math.random() * 6);
          renderDice();
          sfxClack(4 + Math.random() * 4, 'die');
          if (++ticks >= 8) {
            clearInterval(iv);
            displayDice = values.slice();

            displayDice = null;

          }

      function rollDice(onComplete) {
        if (!gameActive || rollsLeft <= 0 || isRolling || isScoring) return;

        selectedTile = null;

        broadcastFx('roll', { values: next, held: heldSnap });
        broadcastState();
        renderAll();

        playRoll(next, heldSnap, function () {
          if (matchId !== myMatch) { renderDice(); return; }
          dice = next;
          isRolling = false;
          broadcastState();
          renderAll();
          postRollFx(next);
          if (typeof onComplete === 'function') onComplete();
        });
      }

      function postRollFx(values) {
        const cur = players[currentPlayerIdx];
        if (!cur) return;
        const open = function (id) { return cur.scores[id] === null; };
        const all = [0, 1, 2, 3, 4];
        if (calcCategoryScore('yacht', values) === 50) {
          if (open('yacht')) { showBanner('YACHT!', '50점 찬스', 'hot'); fireConfetti(false); flashScreen(); bigShake(); buzz([30, 40, 60]); }
          else showChip('YACHT', 'gold');
          celebrate(all);
          return;
        }
        if (calcCategoryScore('largeStraight', values) && open('largeStraight')) { showChip('LARGE STRAIGHT', 'gold'); celebrate(all); sfxCombo(2); buzz(20); return; }
        if (calcCategoryScore('fourKind', values) && open('fourKind')) { showChip('4 OF A KIND', 'gold'); celebrate(contributingDice('fourKind', values)); sfxCombo(2); buzz(20); return; }
        if (calcCategoryScore('fullHouse', values) && open('fullHouse')) { showChip('FULL HOUSE'); celebrate(all); sfxCombo(1); return; }

      }

      // ================= Scoring a category =================
      function commitScore(catId) {
        if (!gameActive || !hasRolledThisTurn || isRolling || isScoring) return;
        const cur = players[currentPlayerIdx];
        if (!cur || cur.scores[catId] !== null) return;

        const prevUpper = getPlayerTotals(cur).upper;

      function advanceTurn() {

      // ================= AI =================
      function chooseAIHolds() {
        const cur = players[currentPlayerIdx];
        const counts = countsOf(dice);
        if (calcCategoryScore('yacht', dice) === 50 && cur.scores.yacht === null) { held = [true, true, true, true, true]; return; }
        if (calcCategoryScore('largeStraight', dice) === 30 && cur.scores.largeStraight === null) { held = [true, true, true, true, true]; return; }
        if (cur.scores.largeStraight === null || cur.scores.smallStraight === null) {
          const s = straightStart(counts, 4);
          if (s) {
            const keep = [false, false, false, false, false];
            for (let v = s; v < s + 4; v++) keep[dice.indexOf(v)] = true;
            held = keep;
            return;
          }
        }
        let bestVal = 1, bestCount = 0;
        for (let v = 6; v >= 1; v--) if (counts[v] > bestCount) { bestCount = counts[v]; bestVal = v; }
        if (bestCount >= 2) for (let i = 0; i < 5; i++) held[i] = dice[i] === bestVal;
        else for (let i = 0; i < 5; i++) held[i] = dice[i] >= 5;
      }
      function chooseAICategory() {
        const cur = players[currentPlayerIdx];
        let bestCat = null, bestWeight = -999;
        CATEGORIES.forEach(function (cat, ci) {
          if (cur.scores[cat.id] !== null) return;
          const pts = calcCategoryScore(cat.id, dice);
          let weight = pts;
          if (cat.id === 'yacht' && pts === 50) weight += 40;
          if (cat.id === 'largeStraight' && pts === 30) weight += 20;
          if (cat.section === 'upper' && pts >= 3 * (ci + 1)) weight += 8;
          if (cat.id === 'choice' && pts < 22) weight -= 10;
          if (pts === 0) {
            if (cat.id === 'yacht') weight = -5;
            else if (cat.id === 'ones') weight = -6;
            else if (cat.id === 'choice') weight = -40;
            else weight = -15;
          }
          if (weight > bestWeight) { bestWeight = weight; bestCat = cat.id; }
        });
        return bestCat;
      }
      function runAITurn() {
        if (!gameActive || !players[currentPlayerIdx].isAI) return;
        clearTimeout(aiTimer);
        const myMatch = matchId;
        const alive = function () { return gameActive && matchId === myMatch; };
        const scoreSoon = function (cat, ms) { aiTimer = setTimeout(function () { if (alive()) commitScore(cat || chooseAICategory()); }, ms); };
        const step = function () {
          if (!alive()) return;
          rollDice(function () {
            if (!alive()) return;
            const cur = players[currentPlayerIdx];
            if (calcCategoryScore('yacht', dice) === 50 && cur.scores.yacht === null) { scoreSoon('yacht', 900); return; }
            if (rollsLeft > 0) {
              const before = held.slice();
              chooseAIHolds();
              if (held.every(function (h) { return h; })) { scoreSoon(null, 800); return; }
              if (held.some(function (h, i) { return h !== before[i]; })) sfxHold(true);
              renderDice();
              aiTimer = setTimeout(step, 750);
            } else {
              scoreSoon(null, 800);
            }
          });
        };
        aiTimer = setTimeout(step, 900);
      }

      function sendAction(msg) {

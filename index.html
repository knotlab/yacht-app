        round = d.round || 1;
        const dv = toArr(d.dice);
        dice = [0, 1, 2, 3, 4].map(function (i) { return Number(dv[i]) || 1; });
        const hv = toArr(d.held);
        held = [0, 1, 2, 3, 4].map(function (i) { return !!hv[i]; });
        rollsLeft = typeof d.rollsLeft === 'number' ? d.rollsLeft : 3;
        hasRolledThisTurn = !!d.hasRolledThisTurn;
        isRolling = !!d.isRolling;
        isScoring = !!d.isScoring;
        gameActive = !!d.gameActive;
        if (!wasActive && gameActive) { resetTotalAnims(); matchId++; OVERLAYS.forEach(closeOv); }
        renderAll();
      }

      function hostAttach() {
        listen(roomRef.child('members'), 'value', function (snap) {
          const list = readMembers(snap);
          if (list.length > knownMembers && knownMembers > 0) {
            const newest = list[list.length - 1];
            onlineStatus.textContent = newest.name + ' 님이 들어왔어요 (' + list.length + '/4)';
            sfxCombo(1);
          }
          if (gameActive && isOnlineMatch) {
            players.forEach(function (p) {
              const was = lobbyMembers.some(function (m) { return m.peerId === p.peerId; });
              const now = list.some(function (m) { return m.peerId === p.peerId; });
              if (was && !now) showToast(p.name + ' 연결 끊김');
              if (!was && now && lobbyMembers.length) showToast(p.name + ' 재접속');
            });
          }
          knownMembers = list.length;
          lobbyMembers = list;
          renderLobby();
        });
        listen(roomRef.child('actions'), 'child_added', function (snap) {
          const data = snap.val();
          snap.ref.remove();
          if (data) handleRemoteAction(data, data.from);
        });
      }

      // host side: a guest asked to roll / hold / score — only honoured on their own turn
      function handleRemoteAction(data, from) {
        if (!gameActive || !isOnlineMatch) return;
        const cur = players[currentPlayerIdx];
        if (!cur || cur.peerId !== from) return;
        if (data.action === 'roll') rollDice();
        else if (data.action === 'hold' && data.idx >= 0 && data.idx < 5) toggleHold(data.idx);
        else if (data.action === 'score' && CATEGORIES.some(function (c) { return c.id === data.catId; })) commitScore(data.catId);
        else if (data.action === 'power' && POWERS[data.kind]) usePower(data.kind, Number(data.idx));
      }

      function sendAction(msg) {
        if (transport === 'p2p') {
          msg.type = 'ACTION';
          try { hostConn.send(msg); } catch (e) { showToast('전송 실패'); }
          return;
        }
        if (!roomRef) return;
        msg.from = myPeerId;
        roomRef.child('actions').push(msg).catch(function () { showToast('전송 실패'); });
      }

      // ---------- P2P (PeerJS) ----------
      function p2pSend(msg) { guestConns.forEach(function (g) { try { g.conn.send(msg); } catch (e) {} }); }

      async function createP2PRoom(nick, tries) {
        tries = tries || 0;
        try { await withTimeout(getPeerLib(), 12000); } catch (e) { onlineStatus.textContent = netError(); return; }
        transport = 'p2p';
        onlineRole = 'host';
        const code = 'YACHT-' + Math.floor(1000 + Math.random() * 9000);
        roomCode = code;
        try { peer = new Peer(code, { debug: 0 }); } catch (e) { onlineStatus.textContent = netError(); return; }
        peer.on('open', function (id) {
          myPeerId = id;
          lobbyMembers = [{ peerId: id, name: nick, isHost: true }];
          displayRoomCode.textContent = code;
          onlineStatus.textContent = '';
          renderLobby();
          updateChatUi();
        });
        peer.on('connection', function (conn) {
          if (lobbyMembers.length >= 4 || (gameActive && isOnlineMatch)) {
            conn.on('open', function () {
              try { conn.send({ type: 'REJECT', reason: lobbyMembers.length >= 4 ? '방이 가득 찼어요' : '이미 시작된 방이에요' }); } catch (e) {}
              setTimeout(function () { conn.close(); }, 300);
            });
            return;
          }
          conn.on('data', function (data) {
            if (!data || !data.type) return;
            if (data.type === 'JOIN') {
              const gName = String(data.name || '').trim().slice(0, 12) || ('게스트 ' + lobbyMembers.length);
              guestConns.push({ peerId: conn.peer, conn: conn });
              lobbyMembers.push({ peerId: conn.peer, name: gName, isHost: false });
              renderLobby();
              p2pSend({ type: 'LOBBY', members: lobbyMembers });
              sfxCombo(1);
            } else if (data.type === 'ACTION') {
              handleRemoteAction(data, conn.peer);
            } else if (data.type === 'CHAT') {
              p2pChatFromGuest(data, conn.peer);
            }
          });
          conn.on('close', function () {
            const gone = lobbyMembers.filter(function (m) { return m.peerId === conn.peer; })[0];
            guestConns = guestConns.filter(function (g) { return g.peerId !== conn.peer; });
            lobbyMembers = lobbyMembers.filter(function (m) { return m.peerId !== conn.peer; });
            renderLobby();
            if (gameActive && isOnlineMatch) { if (gone) showToast(gone.name + ' 연결 끊김'); }
            else p2pSend({ type: 'LOBBY', members: lobbyMembers });
          });
        });
        peer.on('error', function (err) {
          if (err && err.type === 'unavailable-id' && tries < 3) {
            try { peer.destroy(); } catch (e) {}
            peer = null;
            createP2PRoom(nick, tries + 1);
            return;
          }
          onlineStatus.textContent = netError();
        });
      }

      async function joinP2P(code, nick) {
        try { await withTimeout(getPeerLib(), 12000); } catch (e) { onlineStatus.textContent = netError(); return; }
        transport = 'p2p';
        onlineRole = 'guest';
        roomCode = code;
        try { peer = new Peer(undefined, { debug: 0 }); } catch (e) { onlineStatus.textContent = netError(); return; }
        peer.on('open', function (id) {
          myPeerId = id;
          hostConn = peer.connect(code, { reliable: true });
          hostConn.on('open', function () {
            onlineStatus.textContent = '방장 대기 중';
            updateChatUi();
            try { hostConn.send({ type: 'JOIN', name: nick }); } catch (e) {}
          });
          hostConn.on('data', function (data) {
            if (!data || !data.type) return;
            if (data.type === 'REJECT') { showToast(data.reason || '입장 불가'); cleanupPeer(false); }
            else if (data.type === 'LOBBY') { lobbyMembers = data.members || []; renderLobby(); }
            else if (data.type === 'STATE') applyRemoteState(data);
            else if (data.type === 'FX') applyFx(data.kind, data.extra || {});
            else if (data.type === 'CHAT') pushChat(data.m, false);
          });
          hostConn.on('close', function () {
            updateChatUi();
            showToast('방장 연결 끊김');
            if (gameActive && isOnlineMatch) { gameActive = false; renderAll(); }
          });
        });
        peer.on('error', function () {
          if (hostConn && hostConn.open) return; // signalling hiccups after we're connected don't matter
          onlineStatus.textContent = '방을 찾지 못했어요';
        });
      }

      async function createOnlineRoom() {
        ensureAudio();
        cleanupPeer(true);
        const nick = (onlineNickname.value || '').trim().slice(0, 12) || '방장';
        onlineChoice.hidden = true;
        onlineLobby.hidden = false;
        startOnlineBtn.hidden = false;
        startOnlineBtn.disabled = true;
        displayRoomCode.textContent = '…';
        onlineStatus.textContent = '';
        if (netMode !== 'fb' || !FIREBASE_CONFIG) { createP2PRoom(nick); return; }
        try {
          const db = await withTimeout(getDb(), 12000);
          transport = 'fb';
          let code = '';
          for (let i = 0; i < 8 && !code; i++) {
            const c = 'YACHT-' + Math.floor(1000 + Math.random() * 9000);
            const m = (await withTimeout(db.ref('rooms/' + c + '/meta').once('value'), 10000)).val();
            if (!m || Date.now() - (m.createdAt || 0) > 12 * 3600 * 1000) code = c;
          }
          if (!code) throw new Error('busy');
          roomCode = code;
          roomRef = db.ref('rooms/' + code);
          onlineRole = 'host';
          myPeerId = myId;
          const members = {};
          members[myId] = { name: nick, joinedAt: TS(), isHost: true };
          await withTimeout(roomRef.set({ meta: { hostId: myId, createdAt: TS(), hostOnline: true }, members: members }), 10000);
          roomRef.child('meta/hostOnline').onDisconnect().set(false);
          displayRoomCode.textContent = code;
          hostAttach();
          attachChatFb();
          updateChatUi();
          onlineStatus.textContent = '';
        } catch (e) {
          onlineStatus.textContent = netError(e);
        }
      }

      async function joinOnlineRoom(codeOverride) {
        ensureAudio();
        const code = normCode(codeOverride || joinRoomInput.value);
        if (!code) { showToast('방 코드를 입력하세요'); return; }
        cleanupPeer(true);
        const nick = (onlineNickname.value || '').trim().slice(0, 12) || '게스트';
        onlineChoice.hidden = true;
        onlineLobby.hidden = false;
        startOnlineBtn.hidden = true;
        displayRoomCode.textContent = code;
        onlineStatus.textContent = '연결 중…';
        // a server room with this code? otherwise it's a P2P room
        let db = null, ref = null, room = null;
        if (FIREBASE_CONFIG) {
          try {
            db = await withTimeout(getDb(), 12000);
            ref = db.ref('rooms/' + code);
            room = (await withTimeout(ref.once('value'), 10000)).val();
          } catch (e) { room = null; }
        }
        if (!room || !room.meta) { joinP2P(code, nick); return; }
        try {
          transport = 'fb';
          roomCode = code;
          roomRef = ref;
          myPeerId = myId;

          // the host's own tab came back (refresh / dropped connection): resume as host
          if (room.meta.hostId === myId) {
            onlineRole = 'host';
            startOnlineBtn.hidden = false;
            await roomRef.child('members/' + myId).update({ name: nick, isHost: true });
            await roomRef.child('meta/hostOnline').set(true);
            roomRef.child('meta/hostOnline').onDisconnect().set(false);
            hostAttach();
            attachChatFb();
            updateChatUi();
            if (room.state && room.state.gameActive) {
              applyRemoteState(room.state);
              // anything that was mid-animation when the host dropped is settled now
              if (isScoring) { isScoring = false; advanceTurn(); }
              else { isRolling = false; broadcastState(); renderAll(); }
              fx('turn', { idx: currentPlayerIdx, name: players[currentPlayerIdx].name });
              showToast('다시 연결됨');
            } else {
              onlineStatus.textContent = '다시 연결됨';
            }
            return;
          }

          const members = room.members || {};
          const st = room.state;
          const inGame = !!(st && st.gameActive && toArr(st.players).some(function (p) { return p.peerId === myId; }));
          if (st && st.gameActive && !inGame) { onlineStatus.textContent = '이미 시작된 방이에요'; roomRef = null; return; }
          if (!members[myId] && Object.keys(members).length >= 4) { onlineStatus.textContent = '방이 가득 찼어요'; roomRef = null; return; }

          onlineRole = 'guest';
          const meRef = roomRef.child('members/' + myId);
          if (members[myId]) await meRef.update({ name: nick });
          else await meRef.set({ name: nick, joinedAt: TS(), isHost: false });
          meRef.onDisconnect().remove();

          listen(roomRef.child('members'), 'value', function (snap) { lobbyMembers = readMembers(snap); renderLobby(); });
          listen(roomRef.child('state'), 'value', function (snap) { const d = snap.val(); if (d) applyRemoteState(d); });
          let lastKey = null;
          (await roomRef.child('fx').orderByKey().limitToLast(1).once('value')).forEach(function (c) { lastKey = c.key; });
          const fxQuery = lastKey ? roomRef.child('fx').orderByKey().startAfter(lastKey) : roomRef.child('fx').orderByKey();
          listen(fxQuery, 'child_added', function (snap) { const m = snap.val(); if (m && m.kind) applyFx(m.kind, m.extra || {}); });
          attachChatFb();
          updateChatUi();
          listen(roomRef.child('meta'), 'value', function (snap) {
            const m = snap.val();
            if (!m) {
              showToast('방이 닫혔어요');
              const wasPlaying = gameActive && isOnlineMatch;
              cleanupPeer(false);
              if (wasPlaying) { gameActive = false; renderAll(); }
              return;
            }
            if (m.hostOnline === false && gameActive) showToast('방장 연결 끊김');
          });
          onlineStatus.textContent = inGame ? '다시 연결됨' : '방장 대기 중';
        } catch (e) {
          onlineStatus.textContent = netError(e);
        }
      }

      // ================= Chat (online rooms) =================
      // server rooms: rooms/YACHT-####/chat (everyone writes, everyone listens)
      // P2P rooms: guests send to the host, the host relays to everyone (including the sender)
      const chatOv = $('chatOv');
      const chatList = $('chatList');
      const chatInput = $('chatInput');
      const chatBadge = $('chatBadge');
      const QUICK_CHATS = ['ㅋㅋㅋ', '나이스!', '아깝다', '빨리 굴려', '야추 가즈아', 'GG', '👍', '😱'];
      let chatUnread = 0;
      let lastChatAt = 0;

      function chatAvailable() {
        if (!transport || !myPeerId) return false;
        if (transport === 'fb') return !!roomRef;
        return onlineRole === 'host' || !!(hostConn && hostConn.open);
      }
      function myChatName() {
        const me = lobbyMembers.filter(function (m) { return m.peerId === myPeerId; })[0];
        return (me && me.name) || (onlineNickname.value || '').trim().slice(0, 12) || '나';
      }
      function chatColor(from) {
        let idx = players.findIndex(function (p) { return p.peerId === from; });
        if (idx < 0) idx = lobbyMembers.findIndex(function (m) { return m.peerId === from; });
        return PLAYER_COLORS[(idx < 0 ? 0 : idx) % 4];
      }
      function updateChatUi() {
        const ok = chatAvailable();
        $('chatBtn').hidden = !ok;
        $('lobbyChatBtn').hidden = !ok;
        chatBadge.hidden = chatUnread === 0;
        chatBadge.textContent = chatUnread > 9 ? '9+' : String(chatUnread);
        if (!ok && !chatOv.hidden) chatOv.hidden = true;
      }
      function resetChat() {
        chatUnread = 0;
        chatList.innerHTML = '<div class="chat-empty">NO MESSAGES</div>';
        chatOv.hidden = true;
        updateChatUi();
      }
      function openChat() {
        if (!chatAvailable()) return;
        chatOv.hidden = false;
        chatUnread = 0;
        updateChatUi();
        chatList.scrollTop = chatList.scrollHeight;
        if (matchMedia('(hover: hover)').matches) chatInput.focus();
      }
      function closeChat() { chatOv.hidden = true; chatInput.blur(); }

      function seatBubble(from, text) {
        const idx = players.findIndex(function (p) { return p.peerId === from; });
        const seat = idx >= 0 && gameActive ? seatsEl.children[idx] : null;
        if (!seat) return;
        const old = seat.querySelector('.seat-bubble');
        if (old) old.remove();
        const b = document.createElement('div');
        b.className = 'seat-bubble';
        b.textContent = text;
        seat.appendChild(b);
        setTimeout(function () { b.remove(); }, 3400);
      }

      // one entry point for every incoming message (history loads pass quiet = true)
      function pushChat(m, quiet) {
        if (!m) return;
        const text = String(m.text || '').trim().slice(0, 120);
        if (!text) return;
        const name = String(m.name || '').slice(0, 12) || '플레이어';
        const mine = m.from === myPeerId;
        const empty = chatList.querySelector('.chat-empty');
        if (empty) empty.remove();
        const row = document.createElement('div');
        row.className = 'chat-msg' + (mine ? ' me' : '') + (quiet ? '' : ' new');
        const nm = document.createElement('span');
        nm.className = 'chat-name';
        nm.style.color = chatColor(m.from);
        nm.textContent = name;
        const tx = document.createElement('span');
        tx.className = 'chat-text';
        tx.textContent = text;
        if (!mine) row.appendChild(nm);
        row.appendChild(tx);
        chatList.appendChild(row);
        while (chatList.children.length > 80) chatList.removeChild(chatList.firstChild);
        chatList.scrollTop = chatList.scrollHeight;
        if (quiet) return;
        seatBubble(m.from, text);
        if (!mine) {
          tone(880, 0.06, 'sine', 0.05);
          tone(1320, 0.07, 'sine', 0.04, 0, 0.05);
          if (chatOv.hidden) { chatUnread++; updateChatUi(); }
        }
      }

      function sendChat(raw) {
        const text = String(raw || '').trim().slice(0, 120);
        if (!text || !chatAvailable()) return;
        const now = Date.now();
        if (now - lastChatAt < 600) return;
        lastChatAt = now;
        const m = { from: myPeerId, name: myChatName(), text: text };
        if (transport === 'fb') {
          if (!roomRef) return;
          m.t = TS();
          roomRef.child('chat').push(m).catch(function () { showToast('전송 실패'); });
        } else if (onlineRole === 'host') {
          m.t = now;
          pushChat(m);
          p2pSend({ type: 'CHAT', m: m });
        } else {
          try { hostConn.send({ type: 'CHAT', text: text }); } catch (e) { showToast('전송 실패'); }
        }
      }

      async function attachChatFb() {
        const ref = roomRef && roomRef.child('chat');
        if (!ref) return;
        let lastKey = null;
        try {
          const snap = await withTimeout(ref.orderByKey().limitToLast(30).once('value'), 10000);
          if (!roomRef || ref.toString() !== roomRef.child('chat').toString()) return;
          snap.forEach(function (c) { lastKey = c.key; pushChat(c.val(), true); });
        } catch (e) {}
        if (!roomRef) return;
        const q = lastKey ? ref.orderByKey().startAfter(lastKey) : ref.orderByKey();
        listen(q, 'child_added', function (s) { pushChat(s.val(), false); });
      }

      // host relay for P2P guests
      function p2pChatFromGuest(data, fromPeer) {
        const member = lobbyMembers.filter(function (x) { return x.peerId === fromPeer; })[0];
        if (!member) return;
        const m = { from: fromPeer, name: member.name, text: String(data.text || '').slice(0, 120), t: Date.now() };
        pushChat(m);
        p2pSend({ type: 'CHAT', m: m });
      }

      // ================= Match setup =================
      function freshScores() { const s = {}; CATEGORIES.forEach(function (c) { s[c.id] = null; }); return s; }
      function resetTurnState() {
        currentPlayerIdx = 0; round = 1;
        held = [false, false, false, false, false];
        rollsLeft = 3; prevRollsLeft = 3;
        hasRolledThisTurn = false; isRolling = false; isScoring = false; gameActive = true;
        lastScored = null; selectedTile = null; armedPower = null;
        matchId++;
        resetTotalAnims();
        if (use3D()) window.Dice3D.finishNow();
      }
      function startNewMatch(namesOverride, mode) {
        if (audioCtx) ensureAudio();
        clearTimeout(aiTimer);
        cleanupPeer(true);
        isOnlineMatch = false;
        matchMode = mode || selectedMode;
        players = [];
        matchPowers = powerMode;
        if (namesOverride) {
          namesOverride.forEach(function (n) { players.push({ name: n, isAI: false, scores: freshScores() }); });
        } else {
          namesEl.querySelectorAll('input').forEach(function (inp, idx) {
            players.push({ name: (inp.value || '').trim().slice(0, 12) || ('플레이어 ' + (idx + 1)), isAI: false, scores: freshScores() });
          });
        }
        if (matchMode === 'ai') players.push({ name: AI_LEVELS[aiLevel].name, isAI: true, level: aiLevel, scores: freshScores() });
        players.forEach(function (p) { p.pw = matchPowers ? freshPowers() : null; });
        resetTurnState();
        OVERLAYS.forEach(closeOv);
        renderAll();
        if (players.length > 1) fx('turn', { idx: 0, name: players[0].name });
      }
      function startOnlineMatch() {
        if (onlineRole !== 'host' || lobbyMembers.length < 2) return;
        clearTimeout(aiTimer);
        isOnlineMatch = true;
        matchMode = 'online';
        matchPowers = powerMode;
        players = lobbyMembers.map(function (m) { return { name: m.name, isAI: false, peerId: m.peerId, scores: freshScores(), pw: matchPowers ? freshPowers() : null }; });
        resetTurnState();
        OVERLAYS.forEach(closeOv);
        broadcastState();
        renderAll();
        fx('turn', { idx: 0, name: players[0].name });
      }
      function rematch() {
        if (isOnlineMatch) {
          if (onlineRole === 'host') {
            players.forEach(function (p) { p.scores = freshScores(); p.pw = matchPowers ? freshPowers() : null; });
            resetTurnState();
            OVERLAYS.forEach(closeOv);
            broadcastState();
            renderAll();
          } else showToast('방장만 새 게임을 시작할 수 있어요');
          return;
        }
        startNewMatch(players.filter(function (p) { return !p.isAI; }).map(function (p) { return p.name; }), matchMode);
      }

      function renderNames() {
        const count = selectedMode === 'ai' ? 1 : localCount;
        const prev = Array.prototype.map.call(namesEl.querySelectorAll('input'), function (i) { return i.value; });
        namesEl.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const row = document.createElement('div');
          row.className = 'name-row';
          const dot = document.createElement('label');
          dot.className = 'name-dot';
          dot.style.background = PLAYER_COLORS[i];
          dot.textContent = (i + 1) + 'P';
          dot.htmlFor = 'playerName' + i;
          const input = document.createElement('input');
          input.type = 'text';
          input.id = 'playerName' + i;
          input.className = 'text-in';
          input.maxLength = 12;
          input.value = prev[i] != null ? prev[i] : (selectedMode === 'ai' ? '나' : '플레이어 ' + (i + 1));
          row.appendChild(dot);
          row.appendChild(input);
          namesEl.appendChild(row);
        }
        $('countVal').textContent = String(localCount);
      }
      function paintModes() {
        document.querySelectorAll('.mode-card').forEach(function (c) { c.classList.toggle('is-on', c.dataset.mode === selectedMode); });
        $('localSetup').hidden = selectedMode === 'online';
        $('onlineSetup').hidden = selectedMode !== 'online';
        $('countRow').hidden = selectedMode !== 'local';
        $('netSeg').hidden = !FIREBASE_CONFIG;
        $('aiSeg').hidden = selectedMode !== 'ai';
        $('pwToggle').setAttribute('aria-checked', powerMode ? 'true' : 'false');
        document.querySelectorAll('#netSeg .seg-btn').forEach(function (b) { b.classList.toggle('is-on', b.dataset.net === netMode); });
        document.querySelectorAll('#aiSeg .seg-btn').forEach(function (b) { b.classList.toggle('is-on', b.dataset.lv === aiLevel); });
        renderNames();
      }
      function openMode() { OVERLAYS.forEach(closeOv); paintModes(); openOv(modeOv); }
      function openTitle() {
        OVERLAYS.forEach(closeOv);
        $('tResume').hidden = !gameActive;
        let best = 0;
        try { best = parseInt(localStorage.getItem('yachtDeluxe.best') || '0', 10) || 0; } catch (e) {}
        $('tBest').textContent = best ? 'BEST ' + best : '';
        openOv(titleOv);
      }
      // closing the mode picker before any game has started goes back to the title
      function closeMode() { if (gameActive) closeOv(modeOv); else openTitle(); }

      // ================= Bindings =================
      document.querySelectorAll('.mode-card').forEach(function (c) {
        c.addEventListener('click', function () { selectedMode = c.dataset.mode; sfxTick(); paintModes(); });
      });
      $('countMinus').addEventListener('click', function () { localCount = Math.max(2, localCount - 1); sfxTick(); renderNames(); });
      $('countPlus').addEventListener('click', function () { localCount = Math.min(4, localCount + 1); sfxTick(); renderNames(); });
      $('startMatchBtn').addEventListener('click', function () { ensureAudio(); startNewMatch(null, selectedMode); });

          b.addEventListener('collide', (e) => {
            const other = e.body;
            const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
            if (v < 1.2) return;
            const kind = other.tag === 'floor' ? 'floor' : other.tag === 'wall' ? 'wall' : 'die';
            if (kind === 'die' && other.mass > 0 && other.dieIndex < b.dieIndex) return;
            impacts.push({ step: curStep, v, kind, x: b.position.x, z: b.position.z });
          });
          world.addBody(b);
          return b;
        });

        const frames = bodies.map(() => new Float32Array(MAX_STEPS * 7));
        let still = 0, s = 0, settled = false;
        for (; s < MAX_STEPS; s++) {
          curStep = s;
          world.step(1 / 60);
          bodies.forEach((b, k) => {
            const F = frames[k], o = s * 7;
            F[o] = b.position.x; F[o + 1] = b.position.y; F[o + 2] = b.position.z;
            F[o + 3] = b.quaternion.x; F[o + 4] = b.quaternion.y; F[o + 5] = b.quaternion.z; F[o + 6] = b.quaternion.w;
          });
          const allStill = bodies.every((b) => b.velocity.lengthSquared() < 0.01 && b.angularVelocity.lengthSquared() < 0.02);
          still = allStill ? still + 1 : 0;
          if (still > 10 && s > 30) { settled = true; break; }
        }
        const steps = Math.min(s + 1, MAX_STEPS);
        let ok = settled;
        const up = new CANNON.Vec3(0, 1, 0);
        const tops = bodies.map((b) => {
          const lu = b.quaternion.inverse().vmult(up);
          const ax = Math.abs(lu.x), ay = Math.abs(lu.y), az = Math.abs(lu.z);
          const m = Math.max(ax, ay, az);
          if (m < 0.97 || b.position.y > 0.7) ok = false;
          if (m === ax) return new THREE.Vector3(Math.sign(lu.x), 0, 0);
          if (m === ay) return new THREE.Vector3(0, Math.sign(lu.y), 0);
          return new THREE.Vector3(0, 0, Math.sign(lu.z));
        });
        return { frames, steps, impacts, tops, ok };
      }
      function simulate(heldArr, rollingIdx) {
        let res = null;
        for (let attempt = 0; attempt < 6; attempt++) { res = runSim(heldArr, rollingIdx); if (res.ok) break; }
        return res;
      }

      // ---------- playback ----------
      let anim = null, gather = null, shake = 0;
      const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _qs = new THREE.Quaternion();
      const _col = new THREE.Color(), _emi = new THREE.Color();

      function roll(values, heldArr, opts) {
        opts = opts || {};
        if (anim || gather) finishNow();
        const rollingIdx = [];
        for (let i = 0; i < 5; i++) { D[i].held = !!heldArr[i]; if (!heldArr[i]) rollingIdx.push(i); }
        if (!rollingIdx.length) { setTimeout(() => opts.onDone && opts.onDone(), 0); return; }
        const sim = simulate(heldArr, rollingIdx);
        rollingIdx.forEach((i, k) => {
          const d = D[i];
          d.startP.copy(d.group.position);
          const worldQ = d.group.quaternion.clone().multiply(d.mesh.quaternion);
          d.mesh.quaternion.setFromUnitVectors(FACE_N[faceIdx(values[i])], sim.tops[k]);
          d.startQ.copy(worldQ).multiply(d.mesh.quaternion.clone().invert());
          d.rolling = true; d.tween = null; d.hopT0 = -9; d.hover = false;
        });
        anim = {
          frames: sim.frames, steps: sim.steps, impacts: sim.impacts, ii: 0,
          playhead: 0, timeScale: 1, rolling: rollingIdx, values: values.slice(), opts,
          drama: !!opts.drama && !REDUCED, dramaStart: Math.max(12, sim.steps * 0.42),
          centroid: new THREE.Vector3()
        };
        // a hidden tab gets no animation frames: settle at once so the game (and online guests) never stall
        if (document.hidden) finishNow();
      }
      document.addEventListener('visibilitychange', () => { if (document.hidden && (anim || gather)) finishNow(); });
      function applyFrame(a, ph) {
        const last = a.steps - 1;
        const f0 = Math.floor(ph), f1 = Math.min(f0 + 1, last), t = ph - f0;
        const blend = Math.min(1, a.playhead / 7);
        a.centroid.set(0, 0, 0);
        a.rolling.forEach((i, k) => {
          const d = D[i], F = a.frames[k];
          const o0 = f0 * 7, o1 = f1 * 7;
          _p.set(F[o0] + (F[o1] - F[o0]) * t, F[o0 + 1] + (F[o1 + 1] - F[o0 + 1]) * t, F[o0 + 2] + (F[o1 + 2] - F[o0 + 2]) * t);
          _q.set(F[o0 + 3], F[o0 + 4], F[o0 + 5], F[o0 + 6]);
          _q2.set(F[o1 + 3], F[o1 + 4], F[o1 + 5], F[o1 + 6]);
          _q.slerp(_q2, t);
          if (blend < 1) {
            const e = easeOutCubic(blend);
            d.group.position.lerpVectors(d.startP, _p, e);
            d.group.quaternion.slerpQuaternions(d.startQ, _q, e);
          } else {
            d.group.position.copy(_p);
            d.group.quaternion.copy(_q);
          }
          a.centroid.add(d.group.position);
        });
        a.centroid.divideScalar(a.rolling.length);
      }
      function updatePlayback(dt) {
        const a = anim;
        if (!a) return;
        const want = a.drama && a.playhead > a.dramaStart ? 0.3 : 1;
        a.timeScale += (want - a.timeScale) * (1 - Math.exp(-dt * 6));
        a.playhead += dt * 60 * SPEED * a.timeScale;
        const last = a.steps - 1;
        const ph = Math.min(a.playhead, last);
        applyFrame(a, ph);
        while (a.ii < a.impacts.length && a.impacts[a.ii].step <= ph) {
          const im = a.impacts[a.ii++];
          if (a.opts.onImpact) a.opts.onImpact(im.v, im.kind);
          if (im.kind === 'floor' && im.v > 3) spawnRing(im.x, im.z, im.v);
          if (!REDUCED && im.v > 9) shake = Math.max(shake, Math.min(0.28, im.v * 0.016));
        }
        if (a.playhead >= last) beginGather();
      }
      function beginGather() {
        const a = anim;
        anim = null;
        let maxEnd = 0;
        a.rolling.forEach((i, k) => {
          const d = D[i];
          const worldQ = d.group.quaternion.clone().multiply(d.mesh.quaternion);
          d.mesh.quaternion.identity();
          d.group.quaternion.copy(worldQ);
          d.rolling = false;
          d.value = a.values[i];
          d.baseQuat = canonQuat(d.value, jitter());
          const delay = k * 0.05, dur = 0.4;
          d.tween = { fromP: d.group.position.clone(), fromQ: worldQ, toQ: d.baseQuat.clone(), t0: clock + delay, dur, hop: 0.6, onEnd: () => { if (a.opts.onLand) a.opts.onLand(k); } };
          maxEnd = Math.max(maxEnd, delay + dur);
        });
        gather = { at: clock + maxEnd + 0.04, cb: a.opts.onDone };
      }
      function finishNow() {
        if (anim) { anim.playhead = anim.steps - 1; applyFrame(anim, anim.steps - 1); beginGather(); }
        D.forEach((d) => { if (d.tween) d.tween = null; });
        if (gather) { const cb = gather.cb; gather = null; if (cb) cb(); }
      }
      function targetPos(d, out) {
        out.copy(slots[d.i]);
        out.y = 0.5 + d.heldVis * 0.36 + d.hoverVis * 0.14 + (d.held ? Math.sin(clock * 2.6 + d.i) * 0.035 : 0);
        const hp = (clock - d.hopT0) / 0.6;
        if (hp > 0 && hp < 1) out.y += Math.sin(Math.PI * hp) * 1.15;
        return out;
      }
      function updateDice(dt) {
        const k = 1 - Math.exp(-dt * 14);
        D.forEach((d) => {
          d.heldVis += ((d.held ? 1 : 0) - d.heldVis) * k;
          d.hoverVis += ((d.hover ? 1 : 0) - d.hoverVis) * k;
          d.dimVis += ((d.dim ? 1 : 0) - d.dimVis) * k;
          d.hlVis += ((d.hl ? 1 : 0) - d.hlVis) * k;
          if (!d.rolling) {
            targetPos(d, _p);
            if (d.tween) {
              const tw = d.tween;
              const p = clamp01((clock - tw.t0) / tw.dur);
              if (clock < tw.t0) { d.group.position.copy(tw.fromP); d.group.quaternion.copy(tw.fromQ); }
              else {
                const e = easeOutCubic(p);
                d.group.position.lerpVectors(tw.fromP, _p, e);
                d.group.position.y += Math.sin(Math.PI * p) * tw.hop;
                d.group.quaternion.slerpQuaternions(tw.fromQ, tw.toQ, e);
                if (p >= 1) { d.tween = null; d.kickT0 = clock; if (tw.onEnd) tw.onEnd(); }
              }
            } else {
              d.group.position.lerp(_p, 1 - Math.exp(-dt * 20));
              const hp = (clock - d.hopT0) / 0.6;
              if (hp > 0 && hp < 1) { _qs.setFromAxisAngle(UP, easeInOut(hp) * Math.PI * 2).multiply(d.baseQuat); d.group.quaternion.copy(_qs); }
              else d.group.quaternion.slerp(d.baseQuat, 1 - Math.exp(-dt * 16));
            }
          }
          const kp = (clock - d.kickT0) / 0.28;
          d.group.scale.setScalar(kp >= 0 && kp < 1 ? 1 + Math.sin(Math.PI * kp) * 0.16 : 1);

          _col.copy(WHITE).lerp(GOLD, d.heldVis * 0.7).multiplyScalar(1 - d.dimVis * 0.38);
          _emi.setRGB(0, 0, 0).lerp(GOLD, d.heldVis * 0.1);
          if (d.hlVis > 0.01) {
            const pulse = (0.22 + 0.1 * Math.sin(clock * 9)) * d.hlVis;
            _emi.r += d.hlColor.r * pulse; _emi.g += d.hlColor.g * pulse; _emi.b += d.hlColor.b * pulse;
          }
          for (let m = 0; m < 6; m++) { d.mats[m].color.copy(_col); d.mats[m].emissive.copy(_emi); }
          d.ring.position.set(d.group.position.x, 0.012, d.group.position.z);
          d.ring.material.color.copy(GOLD).lerp(d.hlColor, d.hlVis * (1 - d.heldVis * 0.5));
          d.ring.material.opacity = Math.max(d.heldVis * 0.75, d.hlVis * (0.5 + 0.2 * Math.sin(clock * 8)));
        });
        if (gather && clock >= gather.at) { const cb = gather.cb; gather = null; if (cb) cb(); }
      }
      function updateFx() {
        fxRings.forEach((r) => {
          if (!r.mesh.visible) return;
          const p = (clock - r.t0) / 0.45;
          if (p >= 1) { r.mesh.visible = false; return; }
          r.mesh.scale.setScalar(0.6 + p * (1.4 + r.power * 1.6));
          r.mesh.material.opacity = (1 - p) * (0.25 + 0.45 * r.power);
        });
      }
      function updateCamera(dt) {
        shake *= Math.exp(-dt * 10);
        const dramaOn = anim && anim.drama && anim.playhead > anim.dramaStart;
        const targetFov = dramaOn ? 24 : BASE_FOV;
        camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-dt * 4));
        camera.updateProjectionMatrix();
        _p.copy(dramaOn ? anim.centroid : CAM_TARGET);
        if (dramaOn) _p.y = 0.3;
        lookAt.lerp(_p, 1 - Math.exp(-dt * 4));
        camera.position.set(camPos.x + (Math.random() - 0.5) * shake, camPos.y + (Math.random() - 0.5) * shake * 0.5, camPos.z + (Math.random() - 0.5) * shake);
        camera.lookAt(lookAt);
      }

      let last = performance.now();
      function frame(now) {
        requestAnimationFrame(frame);
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (document.hidden) return;
        clock += dt;
        updatePlayback(dt);
        updateDice(dt);
        updateFx();
        updateCamera(dt);
        renderer.render(scene, camera);
      }

      function setState(values, heldArr) {
        if (anim || gather) return;
        for (let i = 0; i < 5; i++) {
          const d = D[i];
          d.held = !!(heldArr && heldArr[i]);
          const v = values[i];
          if (v >= 1 && v <= 6 && d.value !== v) {
            d.value = v;
            const fromQ = d.group.quaternion.clone();
            d.baseQuat = canonQuat(v, jitter());
            d.tween = { fromP: d.group.position.clone(), fromQ, toQ: d.baseQuat.clone(), t0: clock + i * 0.03, dur: 0.35, hop: 0.8, onEnd: null };
          }
        }
      }

      window.Dice3D = {
        ok: true,
        roll,
        setState,
        finishNow,
        isAnimating: () => !!(anim || gather),
        slotRects: () => rects,
        setDim: (b) => D.forEach((d) => { d.dim = !!b; }),
        setHover: (i) => D.forEach((d) => { d.hover = d.i === i; }),
        highlight: (arr, hex) => D.forEach((d) => { d.hl = !!(arr && arr.indexOf(d.i) !== -1); if (hex) d.hlColor.set(hex); }),
        celebrate: (arr) => arr.forEach((i, k) => { if (D[i]) { D[i].hopT0 = clock + k * 0.07; D[i].kickT0 = clock + k * 0.07 + 0.55; } }),
        topFaces: () => D.map((d) => {
          const wq = d.group.quaternion.clone().multiply(d.mesh.quaternion);
          let best = 0, bestDot = -2;
          FACE_N.forEach((nrm, fi) => { const dot = nrm.clone().applyQuaternion(wq).y; if (dot > bestDot) { bestDot = dot; best = fi; } });
          return FACE_V[best];
        })
      };

      canvas.hidden = false;
      layout();
      D.forEach((d) => { d.group.position.set(slots[d.i].x, 0.5, slots[d.i].z); });
      if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
      else window.addEventListener('resize', layout);
      requestAnimationFrame(frame);
      window.dispatchEvent(new CustomEvent('dice3d-ready'));
    })();
  </script>
</body>
</html>
